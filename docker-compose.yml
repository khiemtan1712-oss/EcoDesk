services:
  ecodesk-db:
    image: mysql:8.0
    container_name: ecodesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecodesk_db
      MYSQL_USER: ecodesk
      MYSQL_PASSWORD: ecodesk123
    ports:
      - "3306:3306"
    volumes:
      - ecodesk_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ecodesk-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecodesk-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ecodesk-db:3306/ecodesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ecodesk
      SPRING_DATASOURCE_PASSWORD: ecodesk123
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EcoDesk Studio}
      OTP_SECRET: ${OTP_SECRET:-}
      SEPAY_API_TOKEN: ${SEPAY_API_TOKEN:-}
      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-live}
      SEPAY_API_VERSION: ${SEPAY_API_VERSION:-v2}
      SEPAY_API_BASE_URL: ${SEPAY_API_BASE_URL:-}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
      SEPAY_PAYMENT_PREFIX: ${SEPAY_PAYMENT_PREFIX:-DH}
      SEPAY_SYNC_ENABLED: ${SEPAY_SYNC_ENABLED:-true}
      SEPAY_SYNC_INTERVAL_MS: ${SEPAY_SYNC_INTERVAL_MS:-15000}
      SEPAY_SYNC_LOOKBACK_DAYS: ${SEPAY_SYNC_LOOKBACK_DAYS:-1}
    depends_on:
      ecodesk-db:
        condition: service_healthy

volumes:
  ecodesk_mysql_data:
