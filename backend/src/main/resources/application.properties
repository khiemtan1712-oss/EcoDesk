server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (Defaults to MySQL-compatible H2 in-memory if no external cloud MySQL is supplied)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecodesk_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Automatically load root .env when running Spring Boot directly outside Docker
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Email / OTP settings (read strictly from server environment / .env)
ecodesk.mail.host=${SMTP_HOST:${MAIL_HOST:${SPRING_MAIL_HOST:}}}
ecodesk.mail.port=${SMTP_PORT:${MAIL_PORT:${SPRING_MAIL_PORT:587}}}
ecodesk.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}}
ecodesk.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}}
ecodesk.mail.auth=${SMTP_AUTH:true}
ecodesk.mail.starttls=${SMTP_STARTTLS:true}
ecodesk.mail.ssl=${SMTP_SSL:false}
ecodesk.mail.from=${MAIL_FROM:${SMTP_FROM:}}
ecodesk.mail.from-name=${MAIL_FROM_NAME:EcoDesk Studio}
ecodesk.otp.secret=${OTP_SECRET:}

# SePay API Access & Bank Transfer Settings (read strictly on backend from environment / .env)
ecodesk.sepay.api-token=${SEPAY_API_TOKEN:}
ecodesk.sepay.environment=${SEPAY_ENVIRONMENT:live}
ecodesk.sepay.api-version=${SEPAY_API_VERSION:v2}
ecodesk.sepay.api-base-url=${SEPAY_API_BASE_URL:}
ecodesk.sepay.bank-code=${SEPAY_BANK_CODE:}
ecodesk.sepay.bank-name=${SEPAY_BANK_NAME:}
ecodesk.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
ecodesk.sepay.account-name=${SEPAY_ACCOUNT_NAME:}
ecodesk.sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:DH}
ecodesk.sepay.sync-enabled=${SEPAY_SYNC_ENABLED:true}
ecodesk.sepay.sync-interval-ms=${SEPAY_SYNC_INTERVAL_MS:15000}
ecodesk.sepay.lookback-days=${SEPAY_SYNC_LOOKBACK_DAYS:1}
